name: Release herdr-direct

# Fork-only release workflow for IlyaMichlin/herdr.
# Builds the herdr binary from this fork and publishes it as `herdr-direct-*`
# release assets. Triggered by pushing a `herdr-direct-v*` tag (a pattern that
# deliberately does NOT match the upstream release.yml `v*` trigger) or by
# manual dispatch. The binary itself is still `herdr`; only the release assets
# are renamed.

on:
  push:
    tags:
      - "herdr-direct-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: tag / release name to create (e.g. herdr-direct-v0.7.5)
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-direct-linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-direct-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: herdr-direct-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: herdr-direct-macos-aarch64

    runs-on: ${{ matrix.os }}
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseFast
      LIBGHOSTTY_VT_SIMD: 'true'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
        with:
          version: 0.16.0

      - name: Prefer official Ubuntu mirrors over Azure
        if: runner.os == 'Linux'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
            echo "Using apt mirrors:"
            cat /etc/apt/apt-mirrors.txt
          fi

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -print -delete
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: release-direct-${{ matrix.target }}

      - name: Remove Zig caches
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      # Seed Zig's package cache so `zig build` never has to download these
      # itself. codeberg.org has had DNS outages (NXDOMAIN) that broke the
      # cross-compiled macOS x86_64 build, which is the only target that needs
      # translate_c. Try the upstream URL first, then this fork's mirror
      # release. `zig fetch` recomputes the content hash, so a tampered or
      # wrong mirror file fails here instead of being used.
      - name: Seed Zig package cache
        shell: bash
        env:
          MIRROR: https://github.com/${{ github.repository }}/releases/download/herdr-direct-zig-deps
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          while read -r hash url; do
            file="$tmp/$hash.tar.gz"
            if ! curl -fsSL --retry 5 --retry-all-errors --connect-timeout 10 -o "$file" "$url"; then
              echo "::warning::upstream download failed for $hash; using mirror"
              curl -fsSL --retry 5 --retry-all-errors --connect-timeout 10 -o "$file" "$MIRROR/$hash.tar.gz"
            fi
            got="$(cd vendor/libghostty-vt && zig fetch "$file")"
            if [ "$got" != "$hash" ]; then
              echo "::error::hash mismatch for $url: got $got"
              exit 1
            fi
            echo "seeded $hash"
          done <<'EOF'
          translate_c-0.0.0-Q_BUWhVNBwDOEcIqub4VFPJPB6D9dgwzUMHTX5KWr8Xr https://codeberg.org/vancluever/translate-c/archive/4e879eb8aba615de112eabd1231ea6e01920cead.tar.gz
          EOF

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/herdr ${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8

      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            herdr-direct-linux-x86_64/herdr-direct-linux-x86_64
            herdr-direct-linux-aarch64/herdr-direct-linux-aarch64
            herdr-direct-macos-x86_64/herdr-direct-macos-x86_64
            herdr-direct-macos-aarch64/herdr-direct-macos-aarch64
            install-herdr-direct.sh
